<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="navbar">
        <div class="quit">
            <a href="./index.html"><i class="fa-solid fa-arrow-left"></i> QUIT</a>
        </div>
        <div class="logo">
            <img src="Glossy TypeFast Keyboard Stopwatch Logo.png" alt="" width="80px">
        </div>
       
    </div>
    <div class="test" id="test">
         <div class="content">
            <div class="firline">
                <h1><i class="fa-solid fa-keyboard"></i></h1>
                <h1> Typing <span> Speed Test</span></h1>
                <h4>Type the sentence below as quickly and accurately as possible</h4>
            </div>
            <div class="secline">
                <h3 id="show"></h3>
            </div>
            <div class="thrline">
               <textarea class="form-control" id="exampleFormControlTextarea2" rows="4" disabled></textarea>
            </div>
            <div class="mention" id="result" style="display: none;">
              <h3>Correct letters: <span id="correct">0</span></h3>
              <h3>Wrong letters: <span id="wrong">0</span></h3>
            </div>
            <div class="forline">
                <div class="fast">
                    <h2>
                   <i class="fa-solid fa-clock"></i>
                   <span id="timer">30s</span>
                   </h2>
                   <p> Time Left</p>
                </div>
            
                <div class="start" id="startBtn">
                      <a href="#"> <i class="fa-solid fa-play"></i> Start typing</a>
                </div>
                </div>
                </div>
                </div>
            
    <script src="script.js"></script>
</body>
</html>
